; ===========================================================
; Hovercraft Voting Triad — PlatformIO configuration
; Each node gets its own build environment
; Flash: pio run -e node1 -t upload
; ===========================================================

[common]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit BNO055 @ ^1.6.3
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
  adafruit/Adafruit BMP3XX Library @ ^2.1.4
  fastled/FastLED @ ^3.6.0
  links2004/WebSockets @ ^2.4.1
build_flags =
  -D ARDUINO_ARCH_ESP32
  -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192

; --- NODE 1: Master ---
[env:node1]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps  = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D NODE_ID=1
  -D IS_MASTER=1
src_filter = +<*> -<ground_test.cpp> -<servo_test.cpp> -<crsf_dump.cpp>

; --- NODE 2: Voter / Backup Master ---
[env:node2]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps  = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D NODE_ID=2
src_filter = +<*> -<ground_test.cpp> -<servo_test.cpp> -<crsf_dump.cpp>

; --- NODE 3: Voter / Backup Master ---
[env:node3]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps  = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D NODE_ID=3
src_filter = +<*> -<ground_test.cpp> -<servo_test.cpp> -<crsf_dump.cpp>

; --- NODE 1: Single-node test — no CAN bus required ---
; Flash: pio run -e node1_solo -t upload
[env:node1_solo]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps  = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D NODE_ID=1
  -D IS_MASTER=1
  -D SOLO_NODE=1
src_filter = +<*> -<ground_test.cpp> -<servo_test.cpp> -<crsf_dump.cpp>

; --- HIL: Hardware-In-the-Loop via OpenSim ---
; Fill in HIL_WIFI_SSID / HIL_WIFI_PASS / HIL_HUB_HOST in config.h first
; Flash: pio run -e node1_hil -t upload
[env:node1_hil]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps  = ${common.lib_deps}
board_build.partitions = min_spiffs.csv
build_flags =
  ${common.build_flags}
  -D NODE_ID=1
  -D IS_MASTER=1
  -D SOLO_NODE=1
  -D HIL_MODE=1
src_filter = +<*> -<ground_test.cpp> -<servo_test.cpp> -<crsf_dump.cpp>

; --- CRSF raw byte dump — receiver diagnostics ---
; Flash: pio run -e crsf_dump -t upload
[env:crsf_dump]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
src_filter = +<crsf_dump.cpp>

; --- Minimal PCA9685 servo sweep test ---
; Flash: pio run -e servo_test -t upload
[env:servo_test]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps  = ${common.lib_deps}
src_filter = +<servo_test.cpp>

; ===========================================================
; Ground verification suite — replaces main.cpp
; Flash: pio run -e node1_test -t upload
; Use serial monitor (115200) and follow the menu
; ===========================================================
[env:node1_test]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps  = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D NODE_ID=1
  -D IS_MASTER=1
  -D GROUND_TEST
src_filter = +<*> -<main.cpp>

[env:node2_test]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps  = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D NODE_ID=2
  -D GROUND_TEST
src_filter = +<*> -<main.cpp>

[env:node3_test]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps  = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D NODE_ID=3
  -D GROUND_TEST
src_filter = +<*> -<main.cpp>
